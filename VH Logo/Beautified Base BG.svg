<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <style>
      .rect-bg { fill: #888888; }
      .monogram-h { 
        fill: none; 
        stroke: #000000; 
        stroke-width: 14; 
        stroke-linecap: square; 
        stroke-linejoin: miter; 
      }
      .monogram-v { 
        fill: none; 
        stroke: #E5A93D; 
        stroke-width: 14; 
        stroke-linecap: square; 
        stroke-linejoin: miter; 
      }
      .eye { fill: #E5A93D; }
      .text-main { 
        font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif; 
        font-size: 26px; 
        font-weight: 800; 
        fill: #000000; 
        letter-spacing: 0.25em; 
        text-anchor: middle; 
      }
      .text-sub { 
        font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif; 
        font-size: 10px; 
        font-weight: 600; 
        fill: #555555; 
        letter-spacing: 0.3em; 
        text-anchor: middle; 
      }
      .text-sub-accent { fill: #E5A93D; }
    </style>
  </defs>
  <rect x="0" y="0" width="400" height="400" class="rect-bg" />

  <line x1="235" y1="100" x2="235" y2="210" class="monogram-h"/>
  <polyline points="125,190 165,230 275,120" class="monogram-v"/>
  <line x1="195" y1="140" x2="195" y2="250" class="monogram-h"/>
  <polygon points="215,135 221,145 215,155 209,145" class="eye"/>
  <text x="204" y="365" class="text-main">VERNHYDE</text>
  <text x="200" y="385" class="text-sub">EST. SHIELDHOLD <tspan class="text-sub-accent">UKL</tspan></text>
</svg>

