<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <title>Vernhyde Amber Theme Test - Dual Mode</title>
    <style>
        :root[data-theme="dark"] {
            --bg-canvas: #0d0f11;
            --bg-elevated: #16191d;
            --bg-surface: #111417;
            --bg-navbar: #6f534c;
            --border-muted: #3a3235;
            --border-active: #ffa72e;
            --text-main: #dcdcdc;
            --text-muted: #8a8280;
            --nav-buttons: #ffe3bb;
            --accent-primary: #ffa72e;
            --accent-bright: #fee344;
            --accent-green: #7fa36b;
            --tab-grad-top: #1f2329;
            --tab-glow: rgba(255, 167, 46, 0.35);
        }

        :root[data-theme="light"] {
            --bg-canvas: #f4e6d2;
            --bg-elevated: #eedcc5;
            --bg-surface: #e8d5bc;
            --bg-navbar: #dfd0ba;
            --border-muted: #c4b097;
            --border-active: #b55400;
            --text-main: #26181c;
            --text-muted: #6f534c;
            --nav-buttons: #26181c;
            --accent-primary: #b55400;
            --accent-bright: #9c4119;
            --accent-green: #3b5e2b;
            --tab-grad-top: #faf1e4;
            --tab-glow: rgba(181, 84, 0, 0.25);
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-main);
            font-family: "VernhydeCode", monospace;
            padding: 2rem;
            margin: 0;
            transition: background-color 0.2s, color 0.2s;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: var(--accent-primary);
            margin-bottom: 0.2rem;
        }

        p {
            color: var(--text-muted);
            margin-top: 0;
        }

        .toggle-btn {
            background-color: var(--bg-elevated);
            color: var(--accent-primary);
            border: 1px solid var(--border-active);
            padding: 0.5rem 1rem;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        .section-title {
            margin-top: 2rem;
            border-bottom: 1px solid var(--border-muted);
            padding-bottom: 0.5rem;
            color: var(--accent-bright);
        }

        .browser-window {
            background-color: var(--bg-canvas);
            border: 1px solid var(--border-muted);
            border-radius: 6px;
            overflow: hidden;
            margin-top: 1rem;
        }

        .tab-bar {
            display: flex;
            gap: 2px;
            background-color: var(--bg-surface);
            padding: 6px 6px 0 6px;
            border-bottom: 1px solid var(--border-muted);
        }

        .mock-tab {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-muted);
            padding: 0.4rem 1rem;
            border-radius: 0px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .mock-tab.active {
            background: linear-gradient(180deg, var(--tab-grad-top) 0%, var(--bg-canvas) 100%);
            border: 1px solid var(--border-active);
            border-bottom: none;
            color: var(--accent-bright);
            font-weight: bold;
            box-shadow: 0 0 6px 1px var(--tab-glow);
        }

        .nav-bar {
            background-color: var(--bg-navbar);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-muted);
        }

        .nav-buttons {
            color: var(--nav-buttons);
            font-size: 1rem;
            letter-spacing: 4px;
        }

        .mock-urlbar {
            background-color: var(--bg-canvas);
            border: 1px solid var(--border-muted);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            color: var(--text-main);
            flex-grow: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge-green {
            background-color: rgba(127, 163, 107, 0.15);
            color: var(--accent-green);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.75rem;
            border: 1px solid var(--accent-green);
        }
    </style>
</head>

<body>
    <div class="header-row">
        <div>
            <h1>Vernhyde Amber UI Theme</h1>
            <p>Live dual-state preview (Dark Charcoal & Warm Parchment Light).</p>
        </div>
        <button class="toggle-btn" onclick="toggleTheme()">Toggle Light / Dark</button>
    </div>

    <div class="section-title">Browser Chrome Simulation</div>
    <div class="browser-window">
        <div class="tab-bar">
            <div class="mock-tab">Inbox (3)</div>
            <div class="mock-tab active">tactical_sandbox / main.rs*</div>
            <div class="mock-tab">Documentation</div>
        </div>
        <div class="nav-bar">
            <div class="nav-buttons">🡠 🡢 ↻</div>
            <div class="mock-urlbar">
                <span>https://github.com/Vernhyde/tactical_sandbox</span>
                <span class="badge-green">SECURED</span>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const root = document.documentElement;
            root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
        }
    </script>
</body>

</html>
