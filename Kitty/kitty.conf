# --- Typography & Font Rendering (VernhydeCode Stack) ---
font_family      family="VernhydeCode" style="Regular"
bold_font        family="VernhydeCode" style="Bold"
italic_font      family="VernhydeCode" style="SemiBold Italic"
bold_italic_font family="VernhydeCode" style="SemiBold Italic"
font_size        10.5

# Ensure crisp rendering under Wayland
disable_ligatures cursor
box_drawing_scale 0.001, 1, 1.5, 2

# --- Remote Control for Instant Theme Switching ---
allow_remote_control socket-only
listen_on            unix:$XDG_RUNTIME_DIR/kitty.sock

# --- Window Spacing & Framing ---
placement_strategy         center
window_border_width        1.5pt
window_margin_width        0
single_window_margin_width 0
window_padding_width       4

# --- Layouts & Splits ---
enabled_layouts splits,stack

# Split shortcuts (current working directory preserved)
map ctrl+shift+d        launch --location=hsplit --cwd=current
map ctrl+shift+r        launch --location=vsplit --cwd=current

# Navigation across panes
map ctrl+shift+left     neighboring_window left
map ctrl+shift+right    neighboring_window right
map ctrl+shift+up       neighboring_window up
map ctrl+shift+down     neighboring_window down

# Close active pane
map ctrl+shift+w        close_window

# Toggle zoom/full-screen for active split pane (Stack layout)
map ctrl+shift+z        toggle_layout stack

# --- Cursor Tuning ---
cursor_shape              beam
cursor_beam_thickness     1.8
cursor_blink_interval     0.5
cursor_stop_blinking_after 15.0

# --- Tab Bar Styling ---
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted
tab_bar_min_tabs      1
tab_bar_margin_width  0.0
tab_bar_margin_height 4.0 0.0
active_tab_font_style   bold
inactive_tab_font_style normal

# Custom Tab Titles (Shows tab number, folder name, and activity marker)
tab_title_template "{fmt.fg.tab}${index} {title.split('/')[-1]}"
active_tab_title_template "{fmt.fg.tab}󰌢 {index} {title.split('/')[-1]}"

# --- Terminal Performance & Wayland Sync ---
repaint_delay    8
input_delay      2
sync_to_monitor  yes
enable_audio_bell no

# --- Mouse Selection & Deletion Controls ---
select_by_word_characters @-./_~?&=%+#
copy_on_select clipboard

# Disable all default middle-click and right-click paste actions
mouse_map middle press ungrabbed no_op
mouse_map middle release ungrabbed no_op
mouse_map right press ungrabbed no_op
mouse_map right release ungrabbed no_op

# Selection expansion
mouse_map shift+left press ungrabbed mouse_selection extend

# Middle-click: Delete current line (Ctrl+U: \x15)
mouse_map middle press ungrabbed send_text all \x15
mouse_map middle release ungrabbed no_op

# Right-click: Delete single word backwards (Ctrl+W: \x17)
mouse_map right press ungrabbed send_text all \x17
mouse_map right release ungrabbed no_op

# --- Active Color Theme ---
include current-theme.conf
