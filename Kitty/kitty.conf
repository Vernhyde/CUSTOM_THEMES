# --- Typography & Font Rendering (VernhydeCode Stack) ---
font_family      family="VernhydeCode" style="Regular"
bold_font        family="VernhydeCode" style="Bold"
italic_font      family="VernhydeCode" style="SemiBold Italic"
bold_italic_font family="VernhydeCode" style="SemiBold Italic"
font_size        10.5

# Ensure crisp rendering under Wayland
disable_ligatures cursor
box_drawing_scale 0.001, 1, 1.5, 2

# --- Window Spacing & Framing ---
placement_strategy         center
window_border_width        1.5pt
window_margin_width        0
single_window_margin_width 0
window_padding_width       4

# --- Layouts & Splits ---
enabled_layouts splits,stack

# Window border styling
window_border_width     1.5pt
window_margin_width     0
single_window_margin_width 0
window_padding_width    4

# Border colors (Sigil Gold, Suit Pants, High-Vis Crimson)
active_border_color   #e5a93d
inactive_border_color #3a3235
bell_border_color     #ff5277

# Split shortcuts (current working directory preserved)
map ctrl+shift+d        launch --location=hsplit --cwd=current
map ctrl+shift+r        launch --location=vsplit --cwd=current

# Navigation across panes
map ctrl+shift+left     neighboring_window left
map ctrl+shift+right    neighboring_window right
map ctrl+shift+up       neighboring_window up
map ctrl+shift+down     neighboring_window down

# Close active pane
map ctrl+shift+w        close_window

# Toggle zoom/full-screen for active split pane (Stack layout)
map ctrl+shift+z        toggle_layout stack

# --- Background & Opacity ---
# --- Background & Selection ---
background           #0d0f11
foreground           #dcdcdc
selection_background #4b2b31
selection_foreground #ffe3bb
url_color            #7ec1cf

# Optional subtle Wayland blur/transparency
# background_opacity    0.95
# background_blur       32

# --- Cursor Tuning ---
cursor                    #e5a93d
cursor_text_color         #0d0f11
cursor_shape              beam
cursor_beam_thickness     1.8
cursor_blink_interval     0.5
cursor_stop_blinking_after 15.0

# --- Tab Bar Styling ---
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted
tab_bar_min_tabs      1
tab_bar_margin_width  0.0
tab_bar_margin_height 4.0 0.0

# Colors
active_tab_foreground   #0d0f11
active_tab_background   #e5a93d
active_tab_font_style   bold
inactive_tab_foreground #8a8280
inactive_tab_background #16191d
inactive_tab_font_style normal
tab_bar_background      #0d0f11

# Custom Tab Titles (Shows tab number, folder name, and activity marker)
tab_title_template "{fmt.fg.tab}${index} {title.split('/')[-1]}"
active_tab_title_template "{fmt.fg.tab}󰌢 {index} {title.split('/')[-1]}"

# --- Vernhyde Amber + M81 16-Color ANSI Palette ---
# Black (Elevated Surface & Suit Pants)
color0  #16191d
color8  #53383d

# Red (Boosted Flesh Crimson)
color1  #d9385a
color9  #ff5277

# Green (M81 Highland Moss & Woodland Leaf)
color2  #5f7a50
color10 #7fa36b

# Yellow (Sigil Gold & Eye Yellow)
color3  #e5a93d
color11 #fee344

# Blue (Horn Ochre & Bright Ochre)
color4  #c87a53
color12 #e69870

# Magenta (Boosted Hoof Plum)
color5  #a85c72
color13 #c97a90

# Cyan (Oasis Slate-Cyan)
color6  #5a9aa8
color14 #7ec1cf

# White (Primary Foreground & Skull Bone)
color7  #dcdcdc
color15 #ffe3bb

# --- Terminal Performance & Wayland Sync ---
repaint_delay    8
input_delay      2
sync_to_monitor  yes
enable_audio_bell no

# --- Mouse Selection & Deletion Controls ---
select_by_word_characters @-./_~?&=%+#
copy_on_select clipboard

# Disable all default middle-click and right-click paste actions
mouse_map middle press ungrabbed no_op
mouse_map middle release ungrabbed no_op
mouse_map right press ungrabbed no_op
mouse_map right release ungrabbed no_op

# Selection expansion
mouse_map shift+left press ungrabbed mouse_selection extend

# Middle-click: Delete current line (Ctrl+U: \x15)
mouse_map middle press ungrabbed send_text all \x15
mouse_map middle release ungrabbed no_op

# Right-click: Delete single word backwards (Ctrl+W: \x17)
mouse_map right press ungrabbed send_text all \x17
mouse_map right release ungrabbed no_op
